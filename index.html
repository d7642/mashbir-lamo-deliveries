<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משביר לעמו - ניהול והדפסת שילוט משלוחים</title>
    <meta name="theme-color" content="#dc2626">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S4hS8KnR/IMG-20260716-WA0017.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; }
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .page-break {
                page-break-after: always;
                break-after: page;
            }
        }
        .label-box {
            border: 2px dashed #9ca3af;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            background: #fff;
            position: relative;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <header class="bg-gradient-to-r from-red-800 to-red-600 text-white shadow-lg p-4 text-center flex flex-col items-center justify-center">
        <img src="https://i.ibb.co/S4hS8KnR/IMG-20260716-WA0017.png" alt="משביר לעמו" class="h-16 w-auto object-contain mb-2 bg-white rounded-full p-1 shadow-md">
        <p class="text-xs text-red-100">מערכת ניהול והפקת פתקיות משלוחים חכמה</p>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <div class="lg:col-span-6 bg-white rounded-3xl shadow-xl p-6 flex flex-col justify-between border border-gray-100">
            <div>
                <div class="flex justify-between items-center mb-6 border-b pb-3">
                    <h2 class="text-xl font-black text-gray-800 flex items-center gap-2">
                        <span>📝</span> פרטי משלוח חדש
                    </h2>
                    <button onclick="clearForm()" class="text-xs font-bold text-red-600 bg-red-50 px-3 py-1.5 rounded-full hover:bg-red-100 transition">ניקוי טופס</button>
                </div>

                <form id="delivery-form" class="space-y-4" onsubmit="event.preventDefault();">
                    <div class="relative">
                        <label class="block text-sm font-bold text-gray-700 mb-1">שם לקוח</label>
                        <input type="text" id="customer-name" required autocomplete="off" oninput="updatePreview()"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition font-medium"
                            placeholder="הקלד או בחר לקוח שמור...">
                        <div id="autocomplete-list" class="absolute z-20 w-full bg-white border border-gray-200 rounded-2xl shadow-xl mt-1 max-h-40 overflow-y-auto hidden"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-1">
                            <label class="block text-sm font-bold text-gray-700 mb-1">עיר</label>
                            <input type="text" id="city" value="בני ברק" required oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700 mb-1">כתובת / רחוב ומספר</label>
                            <input type="text" id="street" required oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition" placeholder="למשל: ירושלים 9">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">דירה</label>
                            <input type="text" id="apartment" oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition" placeholder="דירה">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">קומה</label>
                            <input type="text" id="floor" oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition" placeholder="קומה">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">טלפון נייד</label>
                            <input type="tel" id="phone" required oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition" placeholder="050-0000000">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700 mb-1">הערות למשלוח (אופציונלי)</label>
                            <input type="text" id="notes" oninput="updatePreview()"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition" placeholder="למשל: לצלצל באינטרקום">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">עותקים</label>
                            <input type="number" id="copies" value="1" min="1" max="20"
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white focus:outline-none transition">
                        </div>
                    </div>
                </form>
            </div>

            <div class="mt-6 space-y-3">
                <button type="button" onclick="addToQueue()"
                    class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-black py-4 rounded-2xl shadow-lg hover:from-red-700 hover:to-red-800 transition transform active:scale-98 flex items-center justify-center gap-2 text-lg">
                    <span>➕</span> הוסף לתור ההדפסה
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="exportData()"
                        class="bg-gray-100 text-gray-700 font-bold py-2.5 rounded-2xl text-sm hover:bg-gray-200 transition">
                        💾 גיבוי לקוחות
                    </button>
                    <button type="button" onclick="document.getElementById('import-file').click()"
                        class="bg-gray-100 text-gray-700 font-bold py-2.5 rounded-2xl text-sm hover:bg-gray-200 transition">
                        📂 שחזור לקוחות
                    </button>
                    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6 flex flex-col">
            <div class="bg-white rounded-3xl shadow-xl p-5 border border-gray-100 flex flex-col items-center">
                <h3 class="text-sm font-black text-gray-400 uppercase tracking-wider mb-3 w-full text-right">תצוגה מקדימה חיה</h3>
                <div id="live-preview" class="w-full aspect-square border-2 border-dashed border-red-300 rounded-2xl p-4 flex flex-col justify-between bg-white text-right">
                    
                    <div class="text-center">
                        <img src="https://i.ibb.co/S4hS8KnR/IMG-20260716-WA0017.png" alt="משביר לעמו" class="h-12 mx-auto object-contain">
                    </div>

                    <div class="space-y-2.5 my-auto text-right">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-500 whitespace-nowrap">שם:</span>
                            <div class="flex-1 border-b-2 border-gray-300 pb-0.5">
                                <span id="prev-name" class="text-base font-black text-gray-900">שם הלקוח</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-500 whitespace-nowrap">כתובת:</span>
                            <div class="flex-1 border-b-2 border-gray-300 pb-0.5">
                                <span id="prev-street" class="text-sm font-bold text-gray-800">רחוב ומספר</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-500 whitespace-nowrap">מיקום:</span>
                            <div class="flex-1 border-b-2 border-gray-300 pb-0.5">
                                <span id="prev-city" class="text-xs font-bold text-gray-700">בני ברק</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-500 whitespace-nowrap">טלפון:</span>
                            <div class="flex-1 border-b-2 border-gray-300 pb-0.5">
                                <span id="prev-phone" class="text-sm font-black text-red-600">050-0000000</span>
                            </div>
                        </div>
                    </div>

                    <div></div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-xl p-5 border border-gray-100 flex-1 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-3 border-b pb-2">
                        <h3 class="text-base font-black text-gray-800">תור הדפסה מרוכז (<span id="queue-count">0</span>)</h3>
                        <button onclick="clearQueue()" class="text-xs font-bold text-red-500 hover:underline">ניקוי תור</button>
                    </div>
                    <div id="print-queue-list" class="space-y-2 max-h-48 overflow-y-auto">
                        <p class="text-xs text-gray-400 text-center py-4">התור ריק. הוסף משלוחים להדפסה.</p>
                    </div>
                </div>
                <button onclick="printQueue()" id="print-btn" disabled
                    class="mt-4 w-full bg-emerald-600 text-white font-black py-3.5 rounded-2xl shadow-lg hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    🖨️ הדפס את כל התור (4 בעמוד)
                </button>
            </div>
        </div>

        <div class="lg:col-span-3 bg-white rounded-3xl shadow-xl p-5 border border-gray-100 flex flex-col">
            <h3 class="text-base font-black text-gray-800 mb-3 border-b pb-2">לקוחות שמורים</h3>
            <div id="saved-customers-list" class="flex-1 overflow-y-auto space-y-2 max-h-[450px]">
                <p class="text-xs text-gray-400 text-center py-4">אין עדיין לקוחות שמורים.</p>
            </div>
        </div>

    </main>

    <div id="print-section" class="hidden"></div>

    <footer class="text-center py-6 text-xs text-gray-400">
        משביר לעמו - מערכת שילוט מתקדמת &copy; 2026
    </footer>

    <script>
        let customers = JSON.parse(localStorage.getItem('mashbir_customers') || '{}');
        let printQueueItems = [];

        const customerNameInput = document.getElementById('customer-name');
        const autocompleteList = document.getElementById('autocomplete-list');
        const cityInput = document.getElementById('city');
        const streetInput = document.getElementById('street');
        const apartmentInput = document.getElementById('apartment');
        const floorInput = document.getElementById('floor');
        const phoneInput = document.getElementById('phone');
        const notesInput = document.getElementById('notes');
        const copiesInput = document.getElementById('copies');

        updateSavedCustomersUI();
        updatePreview();

        customerNameInput.addEventListener('input', function() {
            const val = this.value.trim();
            autocompleteList.innerHTML = '';
            if (!val) {
                autocompleteList.classList.add('hidden');
                return;
            }

            const matches = Object.keys(customers).filter(name => name.includes(val));
            if (matches.length === 0) {
                autocompleteList.classList.add('hidden');
                return;
            }

            matches.forEach(name => {
                const div = document.createElement('div');
                div.className = 'p-3 hover:bg-gray-50 cursor-pointer text-sm font-medium border-b border-gray-100 last:border-0';
                div.textContent = name;
                div.onclick = () => {
                    fillCustomerData(name);
                    autocompleteList.classList.add('hidden');
                };
                autocompleteList.appendChild(div);
            });
            autocompleteList.classList.remove('hidden');
        });

        function fillCustomerData(name) {
            const data = customers[name];
            if (!data) return;
            customerNameInput.value = name;
            cityInput.value = data.city || 'בני ברק';
            streetInput.value = data.street || '';
            apartmentInput.value = data.apartment || '';
            floorInput.value = data.floor || '';
            phoneInput.value = data.phone || '';
            notesInput.value = data.notes || '';
            updatePreview();
        }

        function updatePreview() {
            document.getElementById('prev-name').textContent = customerNameInput.value.trim() || 'שם הלקוח';
            
            const street = streetInput.value.trim() || 'רחוב ומספר';
            const apt = apartmentInput.value.trim() ? `דירה ${apartmentInput.value.trim()}` : '';
            document.getElementById('prev-street').textContent = apt ? `${street} ${apt}` : street;
            
            const floor = floorInput.value.trim() ? `קומה ${floorInput.value.trim()}` : '';
            const city = cityInput.value.trim() || 'בני ברק';
            document.getElementById('prev-city').textContent = floor ? `${floor} | ${city}` : city;
            
            document.getElementById('prev-phone').textContent = phoneInput.value.trim() || '050-0000000';
        }

        function saveCurrentCustomer() {
            const name = customerNameInput.value.trim();
            if (!name) return;

            customers[name] = {
                city: cityInput.value.trim(),
                street: streetInput.value.trim(),
                apartment: apartmentInput.value.trim(),
                floor: floorInput.value.trim(),
                phone: phoneInput.value.trim(),
                notes: notesInput.value.trim()
            };

            localStorage.setItem('mashbir_customers', JSON.stringify(customers));
            updateSavedCustomersUI();
        }

        function updateSavedCustomersUI() {
            const container = document.getElementById('saved-customers-list');
            const keys = Object.keys(customers);
            if (keys.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">אין עדיין לקוחות שמורים.</p>';
                return;
            }

            container.innerHTML = '';
            keys.reverse().forEach(name => {
                const data = customers[name];
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-2xl hover:bg-gray-100 transition';
                item.innerHTML = `
                    <div class="cursor-pointer flex-1" onclick="fillCustomerData('${name}')">
                        <p class="font-bold text-sm text-gray-800">${name}</p>
                        <p class="text-xs text-gray-500">${data.street || ''} | ${data.phone || ''}</p>
                    </div>
                    <button onclick="deleteCustomer('${name}')" class="text-red-400 hover:text-red-600 text-xs px-2 py-1 font-bold">מחיקה</button>
                `;
                container.appendChild(item);
            });
        }

        function deleteCustomer(name) {
            delete customers[name];
            localStorage.setItem('mashbir_customers', JSON.stringify(customers));
            updateSavedCustomersUI();
        }

        function clearForm() {
            document.getElementById('delivery-form').reset();
            cityInput.value = 'בני ברק';
            updatePreview();
        }

        function addToQueue() {
            const name = customerNameInput.value.trim();
            const street = streetInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!name || !street || !phone) {
                alert('נא למלא לפחות שם לקוח, כתובת וטלפון.');
                return;
            }

            saveCurrentCustomer();

            const item = {
                name,
                city: cityInput.value.trim(),
                street,
                apartment: apartmentInput.value.trim(),
                floor: floorInput.value.trim(),
                phone,
                notes: notesInput.value.trim(),
                copies: parseInt(copiesInput.value) || 1
            };

            printQueueItems.push(item);
            updateQueueUI();
            clearForm();
        }

        function updateQueueUI() {
            const container = document.getElementById('print-queue-list');
            document.getElementById('queue-count').textContent = printQueueItems.length;
            document.getElementById('print-btn').disabled = printQueueItems.length === 0;

            if (printQueueItems.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">התור ריק. הוסף משלוחים להדפסה.</p>';
                return;
            }

            container.innerHTML = '';
            printQueueItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2.5 bg-emerald-50 border border-emerald-100 rounded-xl text-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800">${item.name}</span>
                        <span class="text-xs text-gray-500 block">${item.street}, ${item.city} (עותקים: ${item.copies})</span>
                    </div>
                    <button onclick="removeFromQueue(${index})" class="text-red-500 hover:text-red-700 text-xs px-2 py-1 font-bold">הסר</button>
                `;
                container.appendChild(div);
            });
        }

        function removeFromQueue(index) {
            printQueueItems.splice(index, 1);
            updateQueueUI();
        }

        function clearQueue() {
            printQueueItems = [];
            updateQueueUI();
        }

        function printQueue() {
            if (printQueueItems.length === 0) return;

            let labelsHTML = '';
            printQueueItems.forEach(item => {
                const apt = item.apartment ? `דירה ${item.apartment}` : '';
                const flr = item.floor ? `קומה ${item.floor}` : '';
                const nts = item.notes ? `הערות: ${item.notes}` : '';

                for (let i = 0; i < item.copies; i++) {
                    labelsHTML += `
                        <div class="label-box">
                            <div class="text-center">
                                <img src="https://i.ibb.co/S4hS8KnR/IMG-20260716-WA0017.png" alt="משביר לעמו" style="height: 45px; margin: 0 auto; object-fit: contain;">
                            </div>
                            
                            <div style="display: flex; flex-direction: column; gap: 10px; margin: auto 0;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 11px; font-weight: bold; color: #6b7280; white-space: nowrap;">שם:</span>
                                    <div style="flex: 1; border-bottom: 2px solid #d1d5db; padding-bottom: 2px;">
                                        <span style="font-size: 18px; font-weight: 900; color: #111827;">${item.name}</span>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 11px; font-weight: bold; color: #6b7280; white-space: nowrap;">כתובת:</span>
                                    <div style="flex: 1; border-bottom: 2px solid #d1d5db; padding-bottom: 2px;">
                                        <span style="font-size: 14px; font-weight: bold; color: #1f2937;">${item.street} ${apt}</span>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 11px; font-weight: bold; color: #6b7280; white-space: nowrap;">מיקום:</span>
                                    <div style="flex: 1; border-bottom: 2px solid #d1d5db; padding-bottom: 2px;">
                                        <span style="font-size: 12px; font-weight: bold; color: #374151;">${flr} | ${item.city}</span>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 11px; font-weight: bold; color: #6b7280; white-space: nowrap;">טלפון:</span>
                                    <div style="flex: 1; border-bottom: 2px solid #d1d5db; padding-bottom: 2px;">
                                        <span style="font-size: 16px; font-weight: 900; color: #dc2626;">${item.phone}</span>
                                    </div>
                                </div>
                                ${nts ? `<div style="font-size: 11px; color: #4b5563; margin-top: 4px;">הערות: ${nts}</div>` : ''}
                            </div>

                            <div></div>
                        </div>
                    `;
                }
            });

            const printSection = document.getElementById('print-section');
            printSection.innerHTML = '';

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = labelsHTML;
            const boxes = Array.from(tempDiv.children);

            let pagesContent = '';
            for (let i = 0; i < boxes.length; i += 4) {
                const pageChunk = boxes.slice(i, i + 4);
                let gridItemsHTML = '';
                pageChunk.forEach(box => gridItemsHTML += box.outerHTML);

                pagesContent += `
                    <div class="page-break" style="width: 210mm; height: 297mm; padding: 15mm; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10mm; background: white;">
                        ${gridItemsHTML}
                    </div>
                `;
            }

            printSection.innerHTML = pagesContent;
            window.print();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(customers));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "mashbir_customers_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    customers = imported;
                    localStorage.setItem('mashbir_customers', JSON.stringify(customers));
                    updateSavedCustomersUI();
                    alert('הלקוחות שוחזרו בהצלחה!');
                } catch(err) {
                    alert('קובץ שגוי או פגום.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
